name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Check the tag, metainfo and changelog match the package version
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          grep -qF "<release version=\"$version\"" data/io.github.techbysakh963.Tuck.metainfo.xml \
            || { echo "metainfo has no release entry for $version" >&2; exit 1; }
          awk -v h="## [$version]" 'index($0, h) == 1 { found = 1 } END { exit !found }' CHANGELOG.md \
            || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libxkbcommon-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  deb:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo install cargo-deb --version 3.8.0 --locked
      - run: cargo deb --locked
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb
          if-no-files-found: error

  rpm:
    needs: verify
    runs-on: ubuntu-latest
    # Fedora 40 keeps the binary linked against the GTK 4.14 and glibc baseline;
    # its own Rust is too old, so the toolchain comes from rustup.
    container: fedora:40
    steps:
      - name: Install build dependencies
        # The toolchain installer downloads with curl and unpacks with tar and
        # gzip; the base image does not promise any of them.
        run: >-
          dnf install -y gcc git pkgconf-pkg-config gtk4-devel libadwaita-devel libxkbcommon-devel
          curl ca-certificates tar gzip
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo install cargo-generate-rpm --version 0.21.1 --locked
      - run: cargo build --release --locked
      - run: cargo generate-rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

  assemble:
    # Runs on every trigger so a manual run exercises everything up to the
    # actual publishing.
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Collect packages and write checksums
        run: |
          set -eu
          shopt -s nullglob
          debs=(packages/*.deb)
          rpms=(packages/*.rpm)
          all=(packages/*)
          if [ "${#debs[@]}" -lt 1 ] || [ "${#rpms[@]}" -lt 1 ] \
            || [ "${#all[@]}" -ne $(( ${#debs[@]} + ${#rpms[@]} )) ]; then
            echo "expected .deb and .rpm packages only, got:" >&2
            ls -la packages >&2
            exit 1
          fi
          mkdir release
          cp -- "${debs[@]}" "${rpms[@]}" release/
          (cd release && sha256sum -- *.deb *.rpm > SHA256SUMS)
      - name: Extract release notes
        run: |
          set -eu
          # Read the version from Cargo.toml so this also works when run from a branch.
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          awk -v h="## [$version]" '
            /^## \[/ { if (found) exit; if (index($0, h) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release/release-notes.md
          if ! grep -q '[^[:space:]]' release/release-notes.md; then
            echo "CHANGELOG.md has no notes for $version" >&2
            exit 1
          fi
          cat release/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    # Publishing only makes sense for a pushed tag, not a manual run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.deb release/*.rpm release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file release/release-notes.md
