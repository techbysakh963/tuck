[package]
name = "tuck"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Clipboard history, emoji and symbol picker for GNOME"

[lib]
name = "tuck"
path = "src/lib.rs"

[[bin]]
name = "tuck"
path = "src/main.rs"

[dependencies]
async-channel = "2.5.0"
base64 = "0.23.1"
gtk4 = { version = "0.11", features = ["v4_14"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
libc = "0.2.191"
log = { version = "0.4.35", features = ["std"] }
os_pipe = "1.2.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14", features = ["xfixes", "xtest"] }
zbus = "6"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = 3

# Decoding and encoding large screenshots in unoptimised test builds is very slow.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
