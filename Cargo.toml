[package]
name = "tuck"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Clipboard history, emoji and symbol picker for GNOME"

[lib]
name = "tuck"
path = "src/lib.rs"

[[bin]]
name = "tuck"
path = "src/main.rs"

[dependencies]
async-channel = "2.5.0"
base64 = "0.23.1"
emojis = "0.9.1"
gdk4-x11 = "0.11"
gtk4 = { version = "0.11", features = ["v4_14"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ksni = { version = "0.3.7", features = ["blocking"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
libc = "0.2.191"
log = { version = "0.4.35", features = ["std"] }
os_pipe = "1.2.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14", features = ["xfixes", "xtest"] }
zbus = "6"
zruntime = { version = "0.2", features = ["helper"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = 3

# Decoding and encoding large screenshots in unoptimised test builds is very slow.
[profile.dev.package.image]
opt-level = 3

[package.metadata.deb]
revision = "4"
maintainer = "techbysakh963 <240957230+techbysakh963@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "libgtk-4-1 (>= 4.14), libadwaita-1-0 (>= 1.5)"
extended-description = "Tuck keeps a searchable history of what you copy and pastes it back with one click. It also has emoji and symbol pickers."
maintainer-scripts = "packaging/"
assets = [
    ["target/release/tuck", "usr/bin/tuck", "755"],
    ["data/io.github.techbysakh963.Tuck.desktop", "usr/share/applications/", "644"],
    ["data/io.github.techbysakh963.Tuck.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/io.github.techbysakh963.Tuck.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/io.github.techbysakh963.Tuck-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    ["data/70-tuck-uinput.rules", "usr/lib/udev/rules.d/", "644"],
    ["data/tuck-uinput.conf", "usr/lib/modules-load.d/", "644"],
    ["README.md", "usr/share/doc/tuck/README", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tuck", dest = "/usr/bin/tuck", mode = "755" },
    { source = "data/io.github.techbysakh963.Tuck.desktop", dest = "/usr/share/applications/io.github.techbysakh963.Tuck.desktop", mode = "644" },
    { source = "data/io.github.techbysakh963.Tuck.metainfo.xml", dest = "/usr/share/metainfo/io.github.techbysakh963.Tuck.metainfo.xml", mode = "644" },
    { source = "data/icons/io.github.techbysakh963.Tuck.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.techbysakh963.Tuck.svg", mode = "644" },
    { source = "data/icons/io.github.techbysakh963.Tuck-symbolic.svg", dest = "/usr/share/icons/hicolor/symbolic/apps/io.github.techbysakh963.Tuck-symbolic.svg", mode = "644" },
    { source = "data/70-tuck-uinput.rules", dest = "/usr/lib/udev/rules.d/70-tuck-uinput.rules", mode = "644" },
    { source = "data/tuck-uinput.conf", dest = "/usr/lib/modules-load.d/tuck-uinput.conf", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/tuck/LICENSE", mode = "644", doc = true },
]
post_install_script = "packaging/postinst"
post_uninstall_script = "packaging/postrm"

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.14"
libadwaita = ">= 1.5"
